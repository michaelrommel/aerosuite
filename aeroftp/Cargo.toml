[package]
name = "aeroftp"
publish = false
edition = "2021"

[dependencies]
libunftp       = { path = "../libunftp", features = ["aws_lc_rs", "prometheus", "proxy_protocol"] }
#libunftp      = { version = "0.21.1", features = ["aws_lc_rs", "prometheus", "proxy_protocol"] }
tokio          = { version = "1.48.0", features = ["signal", "macros", "rt-multi-thread"] }
opendal        = { version = "0.56.0", default-features = false, features = ["services-azdls", "services-s3", "executors-tokio", "layers-retry", "reqwest-rustls-tls"] }
anyhow         = { version = "1.0.100" }
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unftp-sbe-opendal  = { path = "../unftp-sbe-opendal" }
unftp-auth-jsonfile = { path = "../libunftp/crates/unftp-auth-jsonfile" }
unftp-core          = { path = "../libunftp/crates/unftp-core" }
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.88"

# ── Redis / Valkey ─────────────────────────────────────────────────────────────
# connection-manager pulls in tokio-comp + aio automatically.
# No TLS features needed for internal VPC access (redis:// not rediss://).
redis      = { version = "1.2", default-features = false, features = ["connection-manager", "tokio-comp", "tokio-rustls-comp", "ahash"] }
tokio-util = { version = "0.7", features = ["compat"] }

# Explicitly depend on rustls so we can call install_default() at startup.
# Both ring (via redis/tls-rustls) and aws-lc-rs (via libunftp) end up in the
# binary; rustls panics unless exactly one provider is installed explicitly.
rustls     = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# ── OpenTelemetry / tracing export ─────────────────────────────────────────────
opentelemetry                      = { version = "0.31" }
opentelemetry_sdk                  = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp                 = { version = "0.31", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.31" }
tracing-opentelemetry              = "0.32"

http          = "1.4.0"
http-body-util = "0.1.3"
hyper         = { version = "1.8.1", features = ["server", "http1"] }
hyper-util    = { version = "0.1.19", features = ["full"] }
prometheus    = { version = "0.14.0", features = ["process"] }

console-subscriber = { version = "0.5.0", optional = true }

[features]
tokio_console = ["console-subscriber", "tokio/tracing"]

[dev-dependencies]
aws-config           = { version = "1.8.12", features = ["credentials-process", "rt-tokio", "behavior-version-latest"] }
aws-types            = "1.3.11"
aws-credential-types = "1.2.11"

[lints.rust]
missing_docs = "warn"
